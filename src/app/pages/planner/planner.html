<div class="w-80">
  <h1>Customize your calendar plan</h1>
  <hr>
  <form>
    <div class="form-check form-check-inline">
      <input class="form-check-input" type="radio" name="selectedMode" id="radioDefault1" [(ngModel)]="selectedMode" value="single" />
      <label class="form-check-label" for="radioDefault1"> Single Year </label>
    </div>

    <div class="form-check form-check-inline">
      <input class="form-check-input" type="radio" name="selectedMode" id="radioDefault2" [(ngModel)]="selectedMode" value="custom" />
      <label class="form-check-label" for="radioDefault2"> Custom Date Range </label>
    </div>

    @if(selectedMode === 'custom') {
      <div class="mt-3">
        <label>Select a date range:</label>
        <br />
        <app-datepicker></app-datepicker>
        <br />
      </div>
    }

    
    <br>
    <button type="submit" class="btn btn-primary mt-3">Submit</button>
  </form>
</div>
